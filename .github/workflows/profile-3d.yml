name: generate 3d contribution card

on:
  # Weekly. A rolling-year skyline looks the same day to day, and the SVG is
  # ~200 KB of poorly-delta-compressing markup, so daily would bloat history
  # for no visible change. 01:00 sits after profile-summary-cards (00:00) and
  # streak (00:30) so the three main pushers never overlap.
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # PROFILE_TOKEN, not the built-in GITHUB_TOKEN. contributionsCollection is
      # identity-scoped: the built-in token has no user identity and returns only
      # the ~86 public contributions instead of the real 878.
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USERNAME: kimonsodu
          SETTING_JSON: ./profile-3d-settings.json

      # A token that lost its scopes still renders a perfectly valid card, just
      # a nearly empty one. Fail loudly instead of committing that.
      - name: verify private contributions were counted
        run: |
          node -e '
          const svg = require("fs").readFileSync("profile-3d-contrib/profile-3d.svg", "utf8");
          const m = svg.match(/>([\d,]+)<\/text><text[^>]*>contributions</);
          if (!m) { console.error("no contribution total found in SVG"); process.exit(1); }
          const total = Number(m[1].replace(/,/g, ""));
          console.log("total contributions:", total);
          if (total < 300) { console.error("public-only data - check PROFILE_TOKEN scopes and the private contributions profile setting"); process.exit(1); }
          '

      # The generator's donut and radar read commitContributionsByRepository,
      # which GitHub only ever fills with public repos, so they described 4 public
      # repos while the calendar counted 878 contributions. Recompute both from
      # sources that do see private work and redraw them.
      - name: recompute donut and radar with private data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          set -euo pipefail

          # Read the window off the calendar the card actually draws. GitHub pads
          # the first week back to a Sunday and anchors to the profile timezone,
          # so `date -u -d '1 year ago'` lands 0-6 days late and would measure the
          # donut and radar over a narrower span than the squares beside them.
          BOUNDS=$(gh api graphql -f query='{ user(login:"kimonsodu") { contributionsCollection { contributionCalendar {
            weeks { contributionDays { date } } } } } }' \
            --jq '.data.user.contributionsCollection.contributionCalendar
                  | "\(.weeks[0].contributionDays[0].date) \(.weeks[-1].contributionDays[-1].date)"')
          read -r FROM TO <<< "$BOUNDS"
          echo "window: $FROM to $TO"

          GHID=$(gh api graphql -f query='{ user(login:"kimonsodu"){ id } }' --jq '.data.user.id')

          # Commits need per-repo history; contributionsCollection counts public only.
          COMMITS=$(gh api graphql -f query="{ viewer { repositories(first:100, ownerAffiliations:OWNER, isFork:false) { nodes {
            defaultBranchRef { target { ... on Commit {
              history(since:\"${FROM}T00:00:00Z\", until:\"${TO}T23:59:59Z\", author:{id:\"$GHID\"}) { totalCount }
            } } } } } } }" \
            --jq '[.data.viewer.repositories.nodes[] | select(.defaultBranchRef.target != null)
                   | .defaultBranchRef.target.history.totalCount] | add // 0')

          # Search reaches private repos the token can read.
          # Assigned first, then read: set -e only catches a failing command
          # substitution on a plain assignment, not inside a `read <<<`.
          W="created:$FROM..$TO"
          COUNTS=$(gh api graphql -f query="{
            i: search(query:\"author:kimonsodu type:issue $W\", type:ISSUE, first:0){issueCount}
            p: search(query:\"author:kimonsodu type:pr $W\",    type:ISSUE, first:0){issueCount}
            r: search(query:\"reviewed-by:kimonsodu type:pr $W\", type:ISSUE, first:0){issueCount}
          }" --jq '"\(.data.i.issueCount) \(.data.p.issueCount) \(.data.r.issueCount)"')
          read -r ISSUES PRS REVIEWS <<< "$COUNTS"

          REPOS=$(gh api graphql -f query='{ viewer { repositories(first:100, ownerAffiliations:OWNER) { nodes { createdAt } } } }' \
            --jq "[.data.viewer.repositories.nodes[] | select(.createdAt >= \"$FROM\")] | length")

          # Repo count by primary language, not bytes: byte-weighting puts HTML on
          # top off the back of build output.
          LANGS=$(gh api graphql -f query='{ viewer { repositories(first:100, ownerAffiliations:OWNER, isFork:false) { nodes {
            primaryLanguage { name color } } } } }' \
            --jq '[.data.viewer.repositories.nodes[] | select(.primaryLanguage != null) | .primaryLanguage]
                  | group_by(.name) | map({name:.[0].name, color:.[0].color, value:length})
                  | sort_by(-.value) | tojson')

          # These queries take the first 100 repos and never paginate. Fine at ~33,
          # but fail loudly rather than silently under-count the day that changes.
          HAS_MORE=$(gh api graphql -f query='{ viewer { repositories(first:100, ownerAffiliations:OWNER) { pageInfo { hasNextPage } } } }' \
            --jq '.data.viewer.repositories.pageInfo.hasNextPage')
          test "$HAS_MORE" = "false"

          RADAR="{\"commit\":$COMMITS,\"issue\":$ISSUES,\"pullreq\":$PRS,\"review\":$REVIEWS,\"repo\":$REPOS}"
          echo "radar: $RADAR"
          test "$COMMITS" -ge 100
          for v in "$ISSUES" "$PRS" "$REVIEWS" "$REPOS"; do
            test -n "$v" && test "$v" -ge 0
          done

          SKYLINE_LANGS="$LANGS" SKYLINE_RADAR="$RADAR" node scripts/patch-skyline.mjs

      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update 3d contribution card"
          # The summary-cards and streak workflows also commit to main.
          git pull --rebase --autostash
          git push
