name: generate streak card

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The card is fetched and committed instead of hotlinked from the README.
      # GitHub proxies external README images through camo, a shared Varnish
      # cache that inherits the origin's 24h max-age. When the entry expires the
      # refill request lands on a cold Vercel function, camo times out, and the
      # card renders blank for every visitor until someone forces a reload.
      # Serving the SVG from this repo takes camo out of the path entirely.
      - name: fetch streak card
        run: |
          curl -fsS --retry 6 --retry-all-errors --retry-delay 15 --max-time 90 \
            -o card.raw \
            "https://github-readme-streak-stats-eta-ten-63.vercel.app?user=kimonsodu&disable_animations=true&background=F2EDE3&border=14161B33&stroke=14161B33&ring=B84721&fire=B84721&currStreakNum=14161B&currStreakLabel=B84721&sideNums=14161B&sideLabels=14161B&dates=57545B&excludeDaysLabel=57545B&cb=${{ github.run_id }}"
          # The origin runs PHP with display_errors on, so a PHP notice can be
          # printed ahead of the SVG body. Anything before the root element makes
          # the file invalid XML and GitHub renders a broken image.
          perl -0777 -pe 's/\A.*?(?=<svg)//s' card.raw > profile-cards-custom/5-streak.svg
          rm card.raw

      # A cold origin can answer with an error card instead of failing outright,
      # so check for real content before committing over a good file.
      - name: verify the card rendered
        run: |
          test "$(head -c 4 profile-cards-custom/5-streak.svg)" = "<svg"
          grep -q "Total Contributions" profile-cards-custom/5-streak.svg
          grep -q "Current Streak" profile-cards-custom/5-streak.svg

      # The card counts all-time from account creation; the 3D skyline counts
      # GitHub's rolling year. Side by side those disagree, so rescope the card
      # to the same window using the same GraphQL field the skyline reads.
      - name: rescope total to the rolling year
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          read -r TOTAL FROM TO <<< "$(gh api graphql -f query='
            { user(login: "kimonsodu") { contributionsCollection { contributionCalendar {
                totalContributions
                weeks { contributionDays { date } }
            } } } }' --jq '.data.user.contributionsCollection.contributionCalendar
              | "\(.totalContributions) \(.weeks[0].contributionDays[0].date) \(.weeks[-1].contributionDays[-1].date)"')"
          echo "rolling year: $TOTAL contributions, $FROM to $TO"
          test "$TOTAL" -ge 300
          STREAK_TOTAL="$TOTAL" STREAK_FROM="$FROM" STREAK_TO="$TO" node scripts/patch-streak.mjs

      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-cards-custom/5-streak.svg
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update streak card"
          # The summary-cards workflow also commits to main, so main can have
          # moved since checkout.
          git pull --rebase --autostash
          git push
